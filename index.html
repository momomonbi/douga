<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パスコード付き動画プレイヤー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow: hidden;
  }

  .container {
    width: 100%;
    height: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* ロック中はカードを中央に置きたいので幅を制限 */
  .container.locked {
    max-width: 720px;
  }

  /* ロック画面 */
  .lock-screen {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 48px 32px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }

  .lock-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }

  .lock-screen h1 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .lock-screen p {
    color: rgba(255, 255, 255, 0.6);
    font-size: 14px;
    margin-bottom: 32px;
  }

  .passcode-display {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .passcode-dot {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 50%;
    transition: all 0.2s;
  }

  .passcode-dot.filled {
    background: #fff;
    border-color: #fff;
  }

  .passcode-dot.error {
    border-color: #ff4757;
    animation: shake 0.4s ease-in-out;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    max-width: 280px;
    margin: 0 auto;
  }

  .key {
    aspect-ratio: 1;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 24px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  .key:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  .key:active {
    transform: scale(0.95);
    background: rgba(255, 255, 255, 0.3);
  }

  .key.action {
    background: transparent;
    font-size: 14px;
  }

  .key.action:hover {
    background: rgba(255, 255, 255, 0.1);
  }

  .error-message {
    color: #ff4757;
    font-size: 13px;
    margin-top: 16px;
    min-height: 18px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .error-message.show {
    opacity: 1;
  }

  /* プレイヤー画面 */
  .player-screen {
    display: none;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    flex-direction: column;
  }

  .player-screen.active {
    display: flex;
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .player-header {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background: rgba(0, 0, 0, 0.5);
  }

  .player-header h2 {
    font-size: 16px;
    font-weight: 500;
  }

  .lock-btn {
    background: rgba(255, 255, 255, 0.1);
    border: none;
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s;
  }

  .lock-btn:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  .video-wrapper {
    flex: 1 1 auto;
    min-height: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    object-fit: contain;
  }

  .video-source-input {
    flex: 0 0 auto;
    padding: 12px 20px;
    background: rgba(0, 0, 0, 0.3);
  }

  .video-source-input label {
    display: block;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 8px;
  }

  .video-source-input input[type="file"],
  .video-source-input input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    margin-bottom: 8px;
  }

  .video-source-input input[type="text"]::placeholder {
    color: rgba(255, 255, 255, 0.4);
  }

  .saved-list {
    flex: 0 0 auto;
    max-height: 30vh;
    overflow-y: auto;
    padding: 8px 20px 16px;
    background: rgba(0, 0, 0, 0.3);
    border-top: 1px solid rgba(255, 255, 255, 0.05);
  }

  .saved-list h3 {
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .saved-list .empty {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.4);
    padding: 8px 0;
  }

  .saved-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .saved-item:hover {
    background: rgba(255, 255, 255, 0.1);
  }

  .saved-item .icon {
    font-size: 16px;
    flex: 0 0 auto;
  }

  .saved-item .name {
    flex: 1 1 auto;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .saved-item .meta {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    flex: 0 0 auto;
  }

  .saved-item .delete-btn {
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.5);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 14px;
    flex: 0 0 auto;
  }

  .saved-item .delete-btn:hover {
    background: rgba(255, 71, 87, 0.2);
    color: #ff4757;
  }
</style>
</head>
<body>
  <div class="container locked" id="container">
    <!-- ロック画面 -->
    <div id="lockScreen" class="lock-screen">
      <div class="lock-icon">🔒</div>
      <h1>パスコードを入力</h1>
      <p>動画を再生するには4桁のパスコードを入力してください</p>

      <div class="passcode-display" id="passcodeDisplay">
        <div class="passcode-dot"></div>
        <div class="passcode-dot"></div>
        <div class="passcode-dot"></div>
        <div class="passcode-dot"></div>
      </div>

      <div class="keypad">
        <button class="key" data-num="1">1</button>
        <button class="key" data-num="2">2</button>
        <button class="key" data-num="3">3</button>
        <button class="key" data-num="4">4</button>
        <button class="key" data-num="5">5</button>
        <button class="key" data-num="6">6</button>
        <button class="key" data-num="7">7</button>
        <button class="key" data-num="8">8</button>
        <button class="key" data-num="9">9</button>
        <button class="key action" id="clearKey">クリア</button>
        <button class="key" data-num="0">0</button>
        <button class="key action" id="deleteKey">⌫</button>
      </div>

      <div class="error-message" id="errorMessage">パスコードが違います</div>
    </div>

    <!-- プレイヤー画面 -->
    <div id="playerScreen" class="player-screen">
      <div class="player-header">
        <h2>🎬 動画プレイヤー</h2>
        <button class="lock-btn" id="lockBtn">ロック</button>
      </div>
      <div class="video-wrapper">
        <video id="videoPlayer" controls controlsList="nodownload">
          お使いのブラウザは video タグに対応していません。
        </video>
      </div>
      <div class="video-source-input">
        <label>動画ファイルを選択（DBに保存されます）</label>
        <input type="file" id="fileInput" accept="video/*">
        <label>または動画URLを入力</label>
        <input type="text" id="urlInput" placeholder="https://example.com/video.mp4">
      </div>
      <div class="saved-list">
        <h3>保存済みの動画</h3>
        <div id="savedItems"></div>
      </div>
    </div>
  </div>

<script>
  // パスコード（4桁）。必要に応じて変更してください。
  const CORRECT_PASSCODE = '1234';

  const container = document.getElementById('container');
  const lockScreen = document.getElementById('lockScreen');
  const playerScreen = document.getElementById('playerScreen');
  const dots = document.querySelectorAll('.passcode-dot');
  const errorMessage = document.getElementById('errorMessage');
  const videoPlayer = document.getElementById('videoPlayer');
  const fileInput = document.getElementById('fileInput');
  const urlInput = document.getElementById('urlInput');

  let currentPasscode = '';

  function updateDisplay() {
    dots.forEach((dot, i) => {
      dot.classList.toggle('filled', i < currentPasscode.length);
      dot.classList.remove('error');
    });
  }

  function showError() {
    dots.forEach(dot => dot.classList.add('error'));
    errorMessage.classList.add('show');
    setTimeout(() => {
      currentPasscode = '';
      updateDisplay();
      errorMessage.classList.remove('show');
    }, 600);
  }

  function unlock() {
    lockScreen.style.display = 'none';
    playerScreen.classList.add('active');
    container.classList.remove('locked');
    if (typeof refreshSavedList === 'function') refreshSavedList();
  }

  function lock() {
    playerScreen.classList.remove('active');
    lockScreen.style.display = 'block';
    container.classList.add('locked');
    currentPasscode = '';
    updateDisplay();
    videoPlayer.pause();
  }

  function checkPasscode() {
    if (currentPasscode === CORRECT_PASSCODE) {
      unlock();
    } else {
      showError();
    }
  }

  document.querySelectorAll('.key[data-num]').forEach(key => {
    key.addEventListener('click', () => {
      if (currentPasscode.length >= 4) return;
      currentPasscode += key.dataset.num;
      updateDisplay();
      if (currentPasscode.length === 4) {
        setTimeout(checkPasscode, 150);
      }
    });
  });

  document.getElementById('deleteKey').addEventListener('click', () => {
    currentPasscode = currentPasscode.slice(0, -1);
    updateDisplay();
  });

  document.getElementById('clearKey').addEventListener('click', () => {
    currentPasscode = '';
    updateDisplay();
  });

  document.addEventListener('keydown', (e) => {
    if (playerScreen.classList.contains('active')) return;
    if (/^[0-9]$/.test(e.key)) {
      if (currentPasscode.length >= 4) return;
      currentPasscode += e.key;
      updateDisplay();
      if (currentPasscode.length === 4) {
        setTimeout(checkPasscode, 150);
      }
    } else if (e.key === 'Backspace') {
      currentPasscode = currentPasscode.slice(0, -1);
      updateDisplay();
    } else if (e.key === 'Escape') {
      currentPasscode = '';
      updateDisplay();
    }
  });

  document.getElementById('lockBtn').addEventListener('click', lock);

  // ===== IndexedDB =====
  const DB_NAME = 'videoPlayerDB';
  const DB_VERSION = 1;
  const STORE = 'videos';
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          const store = db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
          store.createIndex('addedAt', 'addedAt');
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  async function dbAdd(record) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      const req = tx.objectStore(STORE).add(record);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbGetAll() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbGet(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbDelete(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      const req = tx.objectStore(STORE).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  // ===== 保存リスト UI =====
  const savedItems = document.getElementById('savedItems');
  let activeObjectURL = null;

  function setVideoSrc(url) {
    if (activeObjectURL) {
      URL.revokeObjectURL(activeObjectURL);
      activeObjectURL = null;
    }
    if (url.startsWith('blob:')) activeObjectURL = url;
    videoPlayer.src = url;
    videoPlayer.play().catch(() => {});
  }

  function formatDate(d) {
    const date = new Date(d);
    return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
  }

  async function refreshSavedList() {
    const items = await dbGetAll();
    items.sort((a, b) => b.addedAt - a.addedAt);
    savedItems.innerHTML = '';
    if (items.length === 0) {
      savedItems.innerHTML = '<div class="empty">保存された動画はまだありません</div>';
      return;
    }
    for (const item of items) {
      const el = document.createElement('div');
      el.className = 'saved-item';
      el.innerHTML = `
        <span class="icon">${item.type === 'file' ? '🎞️' : '🔗'}</span>
        <span class="name"></span>
        <span class="meta"></span>
        <button class="delete-btn" title="削除">✕</button>
      `;
      el.querySelector('.name').textContent = item.name;
      el.querySelector('.meta').textContent = formatDate(item.addedAt);
      el.addEventListener('click', async (e) => {
        if (e.target.classList.contains('delete-btn')) return;
        const rec = await dbGet(item.id);
        if (rec.type === 'file') {
          setVideoSrc(URL.createObjectURL(rec.blob));
        } else {
          setVideoSrc(rec.url);
        }
      });
      el.querySelector('.delete-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        await dbDelete(item.id);
        refreshSavedList();
      });
      savedItems.appendChild(el);
    }
  }

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    await dbAdd({
      type: 'file',
      name: file.name,
      mime: file.type,
      blob: file,
      addedAt: Date.now()
    });
    setVideoSrc(URL.createObjectURL(file));
    fileInput.value = '';
    refreshSavedList();
  });

  urlInput.addEventListener('change', async (e) => {
    const url = e.target.value.trim();
    if (!url) return;
    await dbAdd({
      type: 'url',
      name: url,
      url: url,
      addedAt: Date.now()
    });
    setVideoSrc(url);
    urlInput.value = '';
    refreshSavedList();
  });

</script>
</body>
</html>
